<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUNNER BROTHERS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
body {
    margin: 0;
    font-family:'Poppins', sans-serif;
    background-color: #e6e6e6;
    padding-bottom: 60px;
}
.navbar {
    display: flex;
    justify-content: space-between;
    background-color: #1c0505;
    overflow: auto;
}
.navbar a {
    flex: 1;
    padding: 15px;
    color: #e6e6e6;
    text-decoration: none;
    font-size: 17px;
    text-align: center;
    transition: background-color 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}
.navbar i {
    margin-right: 10px; 
}
.navbar a:hover {
    background-color: #a39f9f;
    color: #1c0505;
}
@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
    }
    .navbar a {
        width: 100%;
        padding: 10px;
    }
}
.image1 {
    display: block;
    margin-left: auto;
    margin-right: auto;
    width: 400px;
    height: 400px;
    border: none;
    margin-top: 0%;
}
.puzzle-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 10px;
    justify-content: center;
    margin: 20px;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
}
.puzzle-piece {
    position: relative;
    overflow: hidden;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
    padding-bottom: 100%;
    padding-top: 50%;  
}
.puzzle-piece img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: scale-down; 
    transition: transform 0.3s ease;
}
.puzzle-piece:hover img {
    transform: scale(1.05); 
}
.title {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.puzzle-piece:hover .title {
    opacity: 1;
}
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    padding-top: 60px;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.9);
}
.modal-content {
    position: relative;
    margin: auto;
    padding: 0;
    width: 80%;
    max-width: 1200px;
}
.modal-images {
    display: flex;
    overflow: hidden;
}
.modal-image {
    display: none;
    width: 100%;
    max-height: 80vh;
    object-fit: contain;
}
.close {
    position: absolute;
    top: 15px;
    right: 35px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    transition: 0.3s;
}
.close:hover,
.close:focus {
    color: #bbb;
    text-decoration: none;
    cursor: pointer;
}
.prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    width: auto;
    padding: 16px;
    margin-top: -50px;
    color: white;
    font-weight: bold;
    font-size: 20px;
    transition: 0.6s ease;
    border-radius: 0 3px 3px 0;
    user-select: none;
}
.next {
    right: 0;
    border-radius: 3px 0 0 3px;
}
.prev:hover, .next:hover {
    background-color: rgba(0,0,0,0.8);
}
.footer {
    background-color: #1c0505;
    color: #e6e6e6;
    text-align: center;
    padding: 10px;
    position: fixed;
    bottom: 0;
    width: 100%;
    font-size: 14px;
    left: 0;
}
</style>
</head>
<body>
<div class="navbar">
    <a href="gunner.html"><i class="fa-solid fa-camera-retro"></i>Portfolio</a>
    <a href="about.html"><i class="fa-regular fa-circle-user"></i>About Us</a>

function openModal(clusterIndex) {
    modalContent.innerHTML = "";
    images[clusterIndex].forEach(function(src) {
        var img = document.createElement("img");
        img.src = src;
        img.loading = "lazy";
        img.classList.add("modal-image");
        modalContent.appendChild(img);
    });
    currentSlideIndex = 0;
    showSlide(currentSlideIndex);
    modal.style.display = "block";
}

function closeModal() { modal.style.display = "none"; }

function showSlide(slideIndex) {
    var slides = document.querySelectorAll(".modal-image");
    slides.forEach(function(slide, index) {
        slide.style.display = (index === slideIndex) ? 'block' : 'none';
    });
}

function changeSlide(n) {
    var slides = document.querySelectorAll(".modal-image");
    currentSlideIndex = (currentSlideIndex + n + slides.length) % slides.length;
    showSlide(currentSlideIndex);
}

document.addEventListener("keydown", function(event) {
    if (modal.style.display === "block") {
        if (event.key === "ArrowRight") changeSlide(1);
        else if (event.key === "ArrowLeft") changeSlide(-1);
    }
});

window.addEventListener("click", function(event) {
    if (event.target === modal) closeModal();
});
</script>
